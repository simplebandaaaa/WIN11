name: CI-Cloud-Phone-Tailscale

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Setup LXDE Desktop, VNC & Safe Android
      run: |
        sudo apt-get update
        sudo apt-get install -y lxde tightvncserver novnc websockify jq dbus-x11

        # VNC का पासवर्ड सेट करना (123456)
        mkdir -p ~/.vnc
        echo "123456" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

        # xstartup फ़ाइल: यह डेस्कटॉप पर सीधा एंड्रॉइड का वेब-व्यूअर खोलेगी
        cat << 'EOF' > ~/.vnc/xstartup
        #!/bin/sh
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        /usr/bin/lxpanel --profile LXDE &
        /usr/bin/pcmanfm --desktop --profile LXDE &
        
        # एंड्रॉइड कंटेनर के रेडी होने का इंतज़ार करें और फिर लिनक्स के अंदर ही ब्राउज़र में उसे खोलें
        sleep 15
        firefox --new-window http://localhost:6085/app/ &
        
        exec /usr/bin/startlxde
        EOF
        chmod +x ~/.vnc/xstartup

        # पुराना VNC सेशन बंद करें
        tightvncserver -kill :1 || true

        # VNC सर्वर चालू करना
        tightvncserver :1 -geometry 1280x720 -depth 24

        # बिना कर्नल डिपेंडेंसी वाला लाइटवेट एंड्रॉइड इमेज (जो खुद एक वेब-इंटरफेस देता है)
        docker run -d \
          -p 6085:6080 \
          --device /dev/kvm:/dev/kvm \
          --security-opt seccomp=unconfined \
          butmo/docker-android:emulator_11.0 || docker run -d -p 6085:6080 tiredofit/android:latest

        # noVNC प्रॉキシ को बैकग्राउंड में रन करना
        NOVNC_BIN=$(which novnc_proxy || find /usr -name "novnc_proxy" -o -name "launch.sh" | head -n 1)
        $NOVNC_BIN --vnc localhost:5901 --listen 6080 &

    - name: Keep Alive
      run: |
        echo "========================================================"
        echo "लिनक्स चालू है, एंड्रॉइड वेब-व्यूअर लोड हो रहा है..."
        tailscale ip -4
        echo "========================================================"
        sleep 21600
