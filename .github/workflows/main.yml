name: CI-Cloud-Phone-Tailscale

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tightvncserver websockify jq dbus-x11 x11-xserver-utils

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Start Android Emulator via Docker
      run: |
        # होस्ट नेटवर्क मोड और प्रिविलेज्ड राइट्स के साथ ताकि सीधे 6080 पोर्ट एक्सेस हो सके
        docker run -d \
          --net=host \
          --privileged \
          --device /dev/kvm \
          -e EMULATOR_DEVICE="Nexus 5X" \
          -e WEB_HUD=true \
          budtmo/docker-android:emulator_11.0

    - name: Get Tailscale IP and Keep Alive
      run: |
        echo "========================================================"
        echo "आपका क्लाउड फोन आपके प्राइवेट Tailscale नेटवर्क पर लाइव है!"
        echo "नीचे दिए गए IP एड्रेस को नोट करें:"
        tailscale ip -4
        echo "========================================================"
        echo "अब अपने ब्राउज़र में खोलें: http://[आपका-Tailscale-IP]:6080"
        echo "========================================================"
        # 6 घंटे तक लाइव रखने के लिए
        sleep 21600
