name: Windows + Android Emulator + Chrome

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-emulator:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      # =====================================================
      # TAILSCALE
      # =====================================================

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verify Tailscale
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE"
          Write-Host "=============================================="

          tailscale status

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          tailscale ip -4

      # =====================================================
      # WINDOWS RDP + BROWSER DISPLAY
      # =====================================================

      - name: Setup Windows RDP and Browser Display
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD is missing."
          }

          .\scripts\setup-rdp.ps1

      # =====================================================
      # ANDROID EMULATOR
      # =====================================================

      - name: Setup Android Emulator
        shell: powershell
        run: |
          .\scripts\setup-emulator.ps1

      # =====================================================
      # SHOW ACCESS INFO
      # =====================================================

      - name: Show Browser Access
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " WINDOWS + ANDROID EMULATOR READY"
          Write-Host "============================================================"

          $ip = tailscale ip -4

          Write-Host ""
          Write-Host "Chrome URL:"
          Write-Host "http://${ip}:8080"

          Write-Host ""
          Write-Host "RDP:"
          Write-Host "${ip}:3389"

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $ip

          Write-Host ""
          Write-Host "Android:"
          Write-Host "Android 8.0 / API 26"
          Write-Host "AVD: Android26"
          Write-Host "Fullscreen: OFF"

      # =====================================================
      # KEEP RUNNER ALIVE
      # =====================================================

      - name: Keep session alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " SESSION ACTIVE"
          Write-Host "============================================================"

          $ip = tailscale ip -4

          Write-Host ""
          Write-Host "Open in Chrome:"
          Write-Host "http://${ip}:8080"

          Write-Host ""

          while ($true) {

            Write-Host ""
            Write-Host "---------------- STATUS ----------------"

            Write-Host "Time:"
            Get-Date

            Write-Host ""
            Write-Host "Tailscale:"
            tailscale status

            Write-Host ""
            Write-Host "Tailscale IP:"
            tailscale ip -4

            Write-Host ""
            Write-Host "RDP service:"

            $svc = Get-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

            if ($svc) {
              Write-Host $svc.Status
            }

            Write-Host ""
            Write-Host "Android ADB:"

            $adb = "C:\Android\android-sdk\platform-tools\adb.exe"

            if (Test-Path $adb) {
              & $adb devices -l
            }

            Write-Host ""
            Write-Host "Emulator:"

            Get-Process `
              -Name emulator `
              -ErrorAction SilentlyContinue |
              Select-Object Id, ProcessName, CPU |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "Browser port 8080:"

            $port = Get-NetTCPConnection `
              -LocalPort 8080 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($port) {
              Write-Host "LISTENING"
            }
            else {
              Write-Host "NOT LISTENING"
            }

            Start-Sleep -Seconds 60
          }
