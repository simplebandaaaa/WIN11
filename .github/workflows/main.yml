name: CI-Cloud-Phone-Tailscale

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Setup Ultralight LXDE Desktop & VNC
      run: |
        sudo apt-get update
        sudo apt-get install -y lxde tightvncserver novnc websockify jq
        
        # VNC का पासवर्ड सेट करना (123456)
        mkdir -p ~/.vnc
        echo "123456" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd
        
        # VNC सर्वर चालू करना
        tightvncserver :1 -geometry 1280x720 -depth 24
        
        # नो-VNC का नया और बिल्कुल सही पाथ (Ubuntu 22.04+ के लिए)
        /usr/bin/novnc_proxy --vnc localhost:5901 --listen 6080 &

    - name: Print Connection Details & Keep Alive
      run: |
        echo "========================================================"
        echo "सुपर लाइटवेट क्लाउड डेस्कटॉप अब 100% लाइव है!"
        echo "========================================================"
        echo "आपका Tailscale IP एड्रेस:"
        tailscale ip -4
        echo "========================================================"
        echo "अपने मोबाइल ब्राउज़र में खोलें (हुबहू यही लिंक):"
        echo "http://100.88.182.75:6080/vnc.html"
        echo "========================================================"
        sleep 21600
