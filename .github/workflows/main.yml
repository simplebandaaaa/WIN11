name: Windows + Android26 Fast RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-android:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v6

      # =========================================================
      # TAILSCALE
      # =========================================================

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check Tailscale
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " TAILSCALE"
          Write-Host "============================================================"

          tailscale status

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          $ip = (tailscale ip -4).Trim()
          Write-Host $ip

      # =========================================================
      # WINDOWS RDP
      # =========================================================

      - name: Setup Windows RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD GitHub Secret is missing."
          }

          .\scripts\setup-rdp.ps1

      # =========================================================
      # ANDROID EMULATOR
      # =========================================================

      - name: Setup Android Emulator
        shell: powershell
        run: |
          .\scripts\setup-emulator.ps1

      # =========================================================
      # FINAL INFORMATION
      # =========================================================

      - name: Show Access Information
        shell: powershell
        run: |

          $ip = (tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " WINDOWS + ANDROID EMULATOR READY"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "RDP:"
          Write-Host "${ip}:3389"

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host $ip

          Write-Host ""
          Write-Host "Windows:"
          Write-Host "Chrome installed"
          Write-Host "Chrome single-window setup"
          Write-Host "Extensions supported"

          Write-Host ""
          Write-Host "Android:"
          Write-Host "Android 8.0 / API 26"
          Write-Host "AVD: Android26"
          Write-Host "Fullscreen: OFF"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " CONNECT FROM PHONE"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Open your RDP app and connect to:"
          Write-Host "${ip}:3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "runneradmin"

          Write-Host ""
          Write-Host "Password:"
          Write-Host "Your RDP_PASSWORD GitHub Secret"

          Write-Host ""
          Write-Host "============================================================"

      # =========================================================
      # KEEP RUNNER ALIVE
      # =========================================================

      - name: Keep Session Alive
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " SESSION ACTIVE"
          Write-Host "============================================================"

          $ip = (tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "RDP: ${ip}:3389"
          Write-Host "Android26: RUNNING"
          Write-Host "Fullscreen: OFF"

          while ($true) {

              Write-Host ""
              Write-Host "------------------------------------------------------------"
              Write-Host " STATUS"
              Write-Host "------------------------------------------------------------"

              Write-Host ""
              Write-Host "Time:"
              Get-Date

              Write-Host ""
              Write-Host "Tailscale:"
              tailscale status

              Write-Host ""
              Write-Host "Emulator process:"

              Get-Process emulator `
                -ErrorAction SilentlyContinue |
                Select-Object Id,ProcessName,CPU |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "Android boot state:"

              $adb = "C:\Android\android-sdk\platform-tools\adb.exe"

              if (Test-Path $adb) {

                  $state = & $adb -s emulator-5554 get-state 2>$null

                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "ADB device: ONLINE"
                  }
                  else {
                      Write-Host "ADB device: NOT READY"
                  }

              }
              else {
                  Write-Host "ADB not found"
              }

              Write-Host ""
              Write-Host "RDP port:"

              $rdp = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($rdp) {
                  Write-Host "3389 = LISTENING"
              }
              else {
                  Write-Host "3389 = NOT LISTENING"
              }

              Start-Sleep -Seconds 60
          }
