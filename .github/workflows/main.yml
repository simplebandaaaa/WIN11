name: Windows Android Emulator RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-emulator:
    runs-on: windows-latest

    timeout-minutes: 360

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ======================================================
      # TAILSCALE
      # ======================================================

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ======================================================
      # VERIFY TAILSCALE
      # ======================================================

      - name: Verify Tailscale
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE STATUS"
          Write-Host "=============================================="

          tailscale status

          Write-Host ""
          Write-Host "Tailscale IP:"

          tailscale ip -4

      # ======================================================
      # WINDOWS RDP
      # ======================================================

      - name: Setup Windows RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " SETTING UP WINDOWS RDP"
          Write-Host "=============================================="

          .\scripts\setup-rdp.ps1

      # ======================================================
      # ANDROID EMULATOR
      # ======================================================

      - name: Setup Android Emulator
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " SETTING UP ANDROID EMULATOR"
          Write-Host "=============================================="

          .\scripts\setup-emulator.ps1

      # ======================================================
      # SHOW CONNECTION INFORMATION
      # ======================================================

      - name: Show connection information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONNECTION INFORMATION"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          tailscale ip -4

          Write-Host ""
          Write-Host "Tailscale status:"
          tailscale status

          Write-Host ""
          Write-Host "Windows hostname:"
          hostname

          Write-Host ""
          Write-Host "Android Emulator:"
          Write-Host "Android 8.0 / API 26"
          Write-Host "AVD: Android26"
          Write-Host "Resolution: 600x960"
          Write-Host "Fullscreen: OFF"

      # ======================================================
      # KEEP RUNNER ALIVE
      # ======================================================

      - name: Keep session alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " WINDOWS + ANDROID EMULATOR IS READY"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "Workflow will remain active."
          Write-Host "Connect using the Tailscale IP shown above."

          while ($true) {

            Write-Host ""
            Write-Host "----- STATUS -----"

            $time = Get-Date
            Write-Host "Time: $time"

            Write-Host ""
            Write-Host "Tailscale:"
            tailscale status

            Write-Host ""
            Write-Host "Android ADB:"
            & "C:\Android\android-sdk\platform-tools\adb.exe" devices -l

            Write-Host ""
            Write-Host "Emulator process:"

            Get-Process `
              -Name "emulator" `
              -ErrorAction SilentlyContinue |
              Select-Object Id, ProcessName, CPU |
              Format-Table -AutoSize

            Start-Sleep -Seconds 60
          }
