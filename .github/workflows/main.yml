name: CI-Cloud-Phone-Tailscale

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Setup Kernel Modules for Android
      run: |
        # एंड्रॉइड के लिए ज़रूरी कर्नल सेटिंग्स
        sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
        sudo modprobe ashmem_linux || true

    - name: Run Redroid and Web-Scrcpy
      run: |
        # 1. एकदम लाइटवेट सुपर-फ़ास्ट एंड्रॉइड 11 चालू करें
        docker run -d --privileged \
          --name redroid \
          --net=host \
          redroid/redroid:11.0.0-latest \
          androidboot.redroid_width=720 \
          androidboot.redroid_height=1280 \
          androidboot.redroid_dpi=320

        # 2. थोड़ा रुकें ताकि एंड्रॉइड अंदर से बूट हो जाए
        sleep 15

        # 3. सीधे ब्राउज़र में स्क्रीन दिखाने वाला वेब-इंटरफेस (WebRTC) चालू करें
        docker run -d --privileged \
          --name web-scrcpy \
          --net=host \
          -e ADB_SERVER_SOCKET=tcp:localhost:5037 \
          -v /var/run/docker.sock:/var/run/docker.sock \
          allanpk7u/scrcpy-web:latest

    - name: Keep Alive
      run: |
        echo "========================================================"
        echo "अब बिना किसी VNC के, सीधा ब्राउज़र-बेस्ड क्लाउड फोन रेडी है!"
        tailscale ip -4
        echo "========================================================"
        echo "अपने ब्राउज़र में खोलें: http://[आपका-Tailscale-IP]:8000"
        echo "========================================================"
        sleep 21600
