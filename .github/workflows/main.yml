name: CI-Cloud-Phone-Tailscale

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Setup LXDE Desktop, VNC & Non-KVM Android
      run: |
        sudo apt-get update
        # ज़रूरी टूल्स और adb/scrcpy इंस्टॉल करना
        sudo apt-get install -y lxde tightvncserver novnc websockify jq dbus-x11 adb scrcpy

        # VNC का पासवर्ड सेट करना (123456)
        mkdir -p ~/.vnc
        echo "123456" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

        # xstartup फ़ाइल: यह डेस्कटॉप आते ही ADB कनेक्ट करके scrcpy लॉन्च करेगी
        cat << 'EOF' > ~/.vnc/xstartup
        #!/bin/sh
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        /usr/bin/lxpanel --profile LXDE &
        /usr/bin/pcmanfm --desktop --profile LXDE &
        
        # एंड्रॉइड कंटेनर के पूरी तरह बूट होने का इंतज़ार करें (30 सेकंड)
        sleep 30
        adb connect localhost:5555
        sleep 2
        # बिना कर्नल ग्लिच के स्क्रीन रेंडर करने के लिए scrcpy को लाइटवेट मोड में चलाना
        DISPLAY=:1 scrcpy -s localhost:5555 --max-fps=15 --max-size=800 --always-on-top &
        
        exec /usr/bin/startlxde
        EOF
        chmod +x ~/.vnc/xstartup

        # पुराना कोई VNC सेशन हो तो बंद करो
        tightvncserver -kill :1 || true

        # VNC सर्वर को चालू करना
        tightvncserver :1 -geometry 1280x720 -depth 24

        # redroid का 8.1.0 वर्जन बिना KVM और बिना एक्स्ट्रा कर्नल मॉड्यूल्स के दौड़ता है
        docker run -d \
          --privileged \
          --name redroid \
          -p 5555:5555 \
          redroid/redroid:8.1.0-latest \
          androidboot.redroid_width=720 \
          androidboot.redroid_height=1280 \
          androidboot.redroid_dpi=320

        # noVNC प्रॉक्सी को बैकग्राउंड में रन करना
        NOVNC_BIN=$(which novnc_proxy || find /usr -name "novnc_proxy" -o -name "launch.sh" | head -n 1)
        $NOVNC_BIN --vnc localhost:5901 --listen 6080 &

    - name: Keep Alive
      run: |
        echo "========================================================"
        echo "नॉन-KVM एंड्रॉइड फोन बैकग्राउंड में बूट हो रहा है..."
        tailscale ip -4
        echo "========================================================"
        sleep 21600
