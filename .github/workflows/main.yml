name: CI-Cloud-Phone-Tailscale

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Start Android Container
      run: |
        # KVM इनेबल्ड एंड्रॉइड 11 कंटेनर को 6080 पोर्ट पर रन करना
        docker run -d \
          --name=android-container \
          --privileged \
          --device /dev/kvm \
          -p 6080:6080 \
          -e EMULATOR_DEVICE="Nexus 5X" \
          -e WEB_HUD=true \
          budtmo/docker-android:emulator_11.0

    - name: Wait for Android Boot and Keep Alive
      run: |
        echo "========================================================"
        echo "एंड्रॉइड सिस्टम बैकग्राउंड में बूट हो रहा है..."
        echo "इसे पूरी तरह चालू होने में 2 से 3 मिनट का समय लगेगा।"
        echo "========================================================"
        
        # Tailscale IP प्रिंट करना
        echo "आपका Tailscale IP एड्रेस यह है:"
        tailscale ip -4
        echo "========================================================"
        echo "अपने ब्राउज़र में खोलें: http://[आपका-Tailscale-IP]:6080"
        echo "========================================================"
        
        # 6 घंटे तक सेशन को लाइव रखने के लिए
        sleep 21600
