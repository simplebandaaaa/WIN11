name: Windows + Android Emulator + Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-emulator:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ======================================================
      # TAILSCALE
      # ======================================================

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verify Tailscale
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " TAILSCALE"
          Write-Host "============================================================"

          tailscale status

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          $ip = tailscale ip -4
          Write-Host $ip

      # ======================================================
      # WINDOWS RDP + NOVNC
      # ======================================================

      - name: Setup Windows RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD GitHub Secret is missing."
          }

          .\scripts\setup-rdp.ps1

      # ======================================================
      # BROWSER SERVICE DIAGNOSTICS
      # ======================================================

      - name: Test Browser Service
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " BROWSER / NOVNC DIAGNOSTICS"
          Write-Host "============================================================"

          # --------------------------------------------------
          # TAILSCALE IP
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          $ip = (tailscale ip -4).Trim()

          Write-Host $ip

          # --------------------------------------------------
          # PORT 8080
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Checking TCP port 8080..."

          $listener = Get-NetTCPConnection `
              -LocalPort 8080 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($listener) {

              Write-Host ""
              Write-Host "RESULT: 8080 = LISTENING"

              $listener |
                  Select-Object LocalAddress,LocalPort,State,OwningProcess |
                  Format-Table -AutoSize

          }
          else {

              Write-Host ""
              Write-Host "RESULT: 8080 = NOT LISTENING"

          }

          # --------------------------------------------------
          # LOCAL HTTP TEST
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Testing local noVNC HTTP..."

          try {

              $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8080/vnc.html" `
                  -UseBasicParsing `
                  -TimeoutSec 15

              Write-Host ""
              Write-Host "RESULT: LOCAL HTTP = OK"
              Write-Host "HTTP Status: $($response.StatusCode)"
              Write-Host "Content Length: $($response.Content.Length)"

          }
          catch {

              Write-Host ""
              Write-Host "RESULT: LOCAL HTTP = FAILED"
              Write-Host $_.Exception.Message

          }

          # --------------------------------------------------
          # TAILSCALE INTERFACE TEST
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Testing Tailscale IP HTTP..."

          try {

              $response = Invoke-WebRequest `
                  -Uri "http://${ip}:8080/vnc.html" `
                  -UseBasicParsing `
                  -TimeoutSec 15

              Write-Host ""
              Write-Host "RESULT: TAILSCALE HTTP = OK"
              Write-Host "HTTP Status: $($response.StatusCode)"

          }
          catch {

              Write-Host ""
              Write-Host "RESULT: TAILSCALE HTTP = FAILED"
              Write-Host $_.Exception.Message

          }

          # --------------------------------------------------
          # TCP CONNECTION TEST
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Testing Tailscale TCP 8080..."

          try {

              $tcp = Test-NetConnection `
                  -ComputerName $ip `
                  -Port 8080 `
                  -WarningAction SilentlyContinue

              Write-Host ""
              Write-Host "TCP Test:"
              Write-Host "Remote Address: $($tcp.RemoteAddress)"
              Write-Host "Port: $($tcp.RemotePort)"
              Write-Host "TcpTestSucceeded: $($tcp.TcpTestSucceeded)"

          }
          catch {

              Write-Host ""
              Write-Host "TCP TEST FAILED"
              Write-Host $_.Exception.Message

          }

          # --------------------------------------------------
          # FIREWALL
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Checking firewall rules..."

          Get-NetFirewallRule `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.DisplayName -like "*Browser*" -or
                  $_.DisplayName -like "*noVNC*" -or
                  $_.DisplayName -like "*VNC*"
              } |
              Select-Object DisplayName,Enabled,Direction,Action |
              Format-Table -AutoSize

          # --------------------------------------------------
          # WEB PROCESS
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Checking websockify process..."

          Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.ProcessName -match "python|websockify"
              } |
              Select-Object Id,ProcessName,CPU |
              Format-Table -AutoSize

          # --------------------------------------------------
          # NOVNC LOG
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Checking noVNC log..."

          $logs = @(
              "C:\noVNC\websockify.log",
              "C:\noVNC\websockify.log.err"
          )

          foreach ($log in $logs) {

              if (Test-Path $log) {

                  Write-Host ""
                  Write-Host "LOG: $log"

                  Get-Content `
                      -Path $log `
                      -Tail 100 |
                      ForEach-Object {
                          Write-Host $_
                      }
              }
          }

          # --------------------------------------------------
          # FINAL URL
          # --------------------------------------------------

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " BROWSER ACCESS"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Open this in Chrome:"

          Write-Host ""
          Write-Host "http://${ip}:8080/vnc.html"

          Write-Host ""
          Write-Host "============================================================"

      # ======================================================
      # ANDROID EMULATOR
      # ======================================================

      - name: Setup Android Emulator
        shell: powershell
        run: |
          .\scripts\setup-emulator.ps1

      # ======================================================
      # FINAL ACCESS INFORMATION
      # ======================================================

      - name: Show Final Access
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " WINDOWS + ANDROID EMULATOR READY"
          Write-Host "============================================================"

          $ip = (tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "Chrome / noVNC:"
          Write-Host "http://${ip}:8080/vnc.html"

          Write-Host ""
          Write-Host "RDP:"
          Write-Host "${ip}:3389"

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $ip

          Write-Host ""
          Write-Host "Android:"
          Write-Host "Android 8.0 / API 26"

          Write-Host ""
          Write-Host "AVD:"
          Write-Host "Android26"

          Write-Host ""
          Write-Host "Fullscreen:"
          Write-Host "OFF"

          Write-Host ""
          Write-Host "============================================================"

      # ======================================================
      # KEEP RUNNER ALIVE
      # ======================================================

      - name: Keep session alive
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " SESSION ACTIVE"
          Write-Host "============================================================"

          $ip = (tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "Browser:"
          Write-Host "http://${ip}:8080/vnc.html"

          Write-Host ""
          Write-Host "RDP:"
          Write-Host "${ip}:3389"

          Write-Host ""

          while ($true) {

              Write-Host ""
              Write-Host "------------------------------------------------------------"
              Write-Host " STATUS"
              Write-Host "------------------------------------------------------------"

              Write-Host ""
              Write-Host "Time:"
              Get-Date

              Write-Host ""
              Write-Host "Tailscale:"
              tailscale status

              Write-Host ""
              Write-Host "Browser port 8080:"

              $port = Get-NetTCPConnection `
                  -LocalPort 8080 `
                  -State Listen `
                  -ErrorAction SilentlyContinue

              if ($port) {
                  Write-Host "LISTENING"
              }
              else {
                  Write-Host "NOT LISTENING"
              }

              Write-Host ""
              Write-Host "Android ADB:"

              $adb = "C:\Android\android-sdk\platform-tools\adb.exe"

              if (Test-Path $adb) {

                  & $adb devices -l

              }
              else {

                  Write-Host "ADB not found."

              }

              Write-Host ""
              Write-Host "Emulator process:"

              Get-Process `
                  -Name emulator `
                  -ErrorAction SilentlyContinue |
                  Select-Object Id,ProcessName,CPU |
                  Format-Table -AutoSize

              Start-Sleep -Seconds 60
          }
