
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: pwsh
        run: |
          $password = "UmeshPass@2026"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser -Name "RDP" -Password $securePass
          } else {
              New-LocalUser `
                -Name "RDP" `
                -Password $securePass `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP")) {
              throw "RDP user creation failed"
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
              throw "Tailscale installation failed: $($process.ExitCode)"
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed"
          }

          $tsIP = $null

          for ($i = 0; $i -lt 20 -and -not $tsIP; $i++) {
              Start-Sleep -Seconds 3
              $result = & $ts ip -4
              if ($LASTEXITCODE -eq 0 -and $result) {
                  $tsIP = ($result | Select-Object -First 1).Trim()
              }
          }

          if (-not $tsIP) {
              throw "Tailscale IP was not assigned"
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify RDP Port
        shell: pwsh
        run: |
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP port 3389 is not listening"
          }

          Write-Host "RDP listener detected."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      - name: Keep RDP Session Alive
        shell: pwsh
        run: |
          Write-Host "RDP runner is active."
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: UmeshPass@2026"
          Write-Host "Connect using a device on the same Tailscale network."

          while ($true) {
              Write-Host "[$(Get-Date)] Runner active"
              Start-Sleep -Seconds 60
          }
