name: Android 10 API 29 RDP

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Optional direct APK URL"
        required: false
        type: string

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================================
      # 1. WINDOWS RDP
      # ============================================================
      - name: Configure Windows RDP
        shell: pwsh
        run: |
          Write-Host "=== Configuring RDP ==="

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule name="Android-RDP" 2>$null

          netsh advfirewall firewall add rule `
            name="Android-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            profile=any

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Write-Host "RDP enabled."

      # ============================================================
      # 2. CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD GitHub Secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser -Name "AndroidRDP" `
            -ErrorAction SilentlyContinue

          if ($existing) {
              Set-LocalUser `
                -Name "AndroidRDP" `
                -Password $securePassword

              Enable-LocalUser -Name "AndroidRDP"
          }
          else {
              New-LocalUser `
                -Name "AndroidRDP" `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires:$false
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "AndroidRDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "AndroidRDP" `
            -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "AndroidRDP")) {
              throw "AndroidRDP user creation failed."
          }

          Write-Host "RDP user ready."

      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "=== Installing Tailscale ==="

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Tailscale installed."

      # ============================================================
      # 4. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY GitHub Secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="android29-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {

              $ip = (& $ts ip -4 2>$null |
                Select-Object -First 1).Trim()

              if ($ip -match '^\d+\.\d+\.\d+\.\d+$') {
                  break
              }

              Write-Host "Waiting for Tailscale IP..."
              Start-Sleep -Seconds 3
          }

          if ($ip -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw "Tailscale IPv4 address was not assigned."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale IP: $ip"

      # ============================================================
      # 5. INSTALL ANDROID SDK COMPONENTS
      # ============================================================
      - name: Install Android 10 API 29
        shell: pwsh
        run: |
          Write-Host "=== Android SDK ==="

          $sdk = $env:ANDROID_SDK_ROOT

          if ([string]::IsNullOrWhiteSpace($sdk)) {
              $sdk = $env:ANDROID_HOME
          }

          if ([string]::IsNullOrWhiteSpace($sdk)) {
              $sdk = "C:\Android\android-sdk"
          }

          $env:ANDROID_SDK_ROOT = $sdk
          $env:ANDROID_HOME = $sdk

          "ANDROID_SDK_ROOT=$sdk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "SDK: $sdk"

          $sdkmanager = Get-ChildItem `
            -Path $sdk `
            -Filter sdkmanager.bat `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $sdkmanager) {
              throw "sdkmanager.bat not found."
          }

          $sdkmanager = $sdkmanager.FullName

          $avdmanager = Get-ChildItem `
            -Path $sdk `
            -Filter avdmanager.bat `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $avdmanager) {
              throw "avdmanager.bat not found."
          }

          $avdmanager = $avdmanager.FullName

          "SDKMANAGER=$sdkmanager" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "AVDMANAGER=$avdmanager" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          & $sdkmanager `
            "--licenses" `
            | ForEach-Object { "y" } |
            & $sdkmanager "--licenses"

          & $sdkmanager `
            "platform-tools" `
            "emulator" `
            "platforms;android-29" `
            "system-images;android-29;google_apis;x86_64"

          if ($LASTEXITCODE -ne 0) {
              throw "Android SDK installation failed."
          }

          Write-Host "Android 10/API 29 installed."

      # ============================================================
      # 6. CREATE AVD
      # ============================================================
      - name: Create Android 10 AVD
        shell: pwsh
        run: |
          Write-Host "=== Creating Android29 AVD ==="

          $avdHome = "$env:USERPROFILE\.android"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $avdHome |
            Out-Null

          $env:ANDROID_AVD_HOME = "$avdHome\avd"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:ANDROID_AVD_HOME |
            Out-Null

          "ANDROID_AVD_HOME=$env:ANDROID_AVD_HOME" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $old = & $env:AVDMANAGER list avd 2>$null

          if ($old -match "Android29") {
              & $env:AVDMANAGER delete avd -n Android29
          }

          "no" |
            & $env:AVDMANAGER create avd `
              -n Android29 `
              -k "system-images;android-29;google_apis;x86_64" `
              -d "pixel_2" `
              --force

          if ($LASTEXITCODE -ne 0) {
              throw "AVD creation failed."
          }

          Write-Host "=== AVD LIST ==="
          & $env:AVDMANAGER list avd

      # ============================================================
      # 7. OPTIMIZE AVD
      # ============================================================
      - name: Optimize Android AVD
        shell: pwsh
        run: |
          $config = "$env:ANDROID_AVD_HOME\Android29.avd\config.ini"

          if (-not (Test-Path $config)) {
              throw "AVD config not found: $config"
          }

          Add-Content $config @"
          hw.ramSize=2048
          vm.heapSize=256
          hw.cpu.ncore=2
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=240
          hw.gpu.enabled=yes
          hw.gpu.mode=auto
          hw.audioInput=no
          hw.audioOutput=no
          hw.camera.back=none
          hw.camera.front=none
          fastboot.forceColdBoot=yes
          disk.dataPartition.size=4096M
          "@

          Write-Host "AVD optimized."

      # ============================================================
      # 8. START EMULATOR
      # ============================================================
      - name: Start Android Emulator
        shell: pwsh
        run: |
          Write-Host "=== Starting Android 10 Emulator ==="

          $emulator = Get-ChildItem `
            -Path $env:ANDROID_SDK_ROOT `
            -Filter emulator.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $emulator) {
              throw "emulator.exe not found."
          }

          $emulator = $emulator.FullName

          Write-Host "Emulator: $emulator"

          $args = @(
              "-avd", "Android29",
              "-gpu", "auto",
              "-no-boot-anim",
              "-no-snapshot",
              "-no-audio",
              "-camera-back", "none",
              "-camera-front", "none",
              "-memory", "2048",
              "-cores", "2",
              "-netdelay", "none",
              "-netspeed", "full"
          )

          Start-Process `
            -FilePath $emulator `
            -ArgumentList $args `
            -WindowStyle Normal

          Write-Host "Emulator process started."

      # ============================================================
      # 9. WAIT FOR ADB / BOOT
      # ============================================================
      - name: Wait for Android Boot
        shell: pwsh
        run: |
          $adb = Get-ChildItem `
            -Path $env:ANDROID_SDK_ROOT `
            -Filter adb.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $adb) {
              throw "adb.exe not found."
          }

          $adb = $adb.FullName

          "ADB=$adb" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          & $adb start-server

          $ready = $false

          for ($i = 1; $i -le 120; $i++) {

              $state = (& $adb get-state 2>$null).Trim()

              if ($state -eq "device") {
                  Write-Host "ADB device detected."
                  $ready = $true
                  break
              }

              Write-Host "Waiting for emulator... $i/120"
              Start-Sleep -Seconds 2
          }

          if (-not $ready) {
              & $adb devices
              throw "Android Emulator did not become ready."
          }

          for ($i = 1; $i -le 90; $i++) {

              $boot = (& $adb shell getprop sys.boot_completed 2>$null).Trim()

              if ($boot -eq "1") {
                  Write-Host "Android boot completed."
                  break
              }

              Write-Host "Waiting for Android boot... $i/90"
              Start-Sleep -Seconds 2
          }

          $boot = (& $adb shell getprop sys.boot_completed).Trim()

          if ($boot -ne "1") {
              throw "Android did not finish booting."
          }

          & $adb shell settings put global window_animation_scale 0
          & $adb shell settings put global transition_animation_scale 0
          & $adb shell settings put global animator_duration_scale 0

          Write-Host "Android 10 ready."

      # ============================================================
      # 10. OPTIONAL APK DOWNLOAD + INSTALL
      # ============================================================
      - name: Download and Install APK
        if: ${{ inputs.apk_url != '' }}
        shell: pwsh
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          Write-Host "=== APK Installation ==="

          $apk = "$env:RUNNER_TEMP\app.apk"

          Invoke-WebRequest `
            -Uri $env:APK_URL `
            -OutFile $apk

          if (-not (Test-Path $apk)) {
              throw "APK download failed."
          }

          $size = (Get-Item $apk).Length

          Write-Host "APK size: $size bytes"

          & $env:ADB install -r -d $apk

          if ($LASTEXITCODE -ne 0) {
              throw "APK installation failed."
          }

          Write-Host "APK installed successfully."

      # ============================================================
      # 11. VERIFY EMULATOR
      # ============================================================
      - name: Verify Android
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "ANDROID INFORMATION"
          Write-Host "=========================================="

          & $env:ADB shell getprop ro.build.version.release
          & $env:ADB shell getprop ro.build.version.sdk
          & $env:ADB shell getprop ro.product.cpu.abi

          Write-Host "=========================================="

          & $env:ADB devices

      # ============================================================
      # 12. SHOW CONNECTION INFORMATION
      # ============================================================
      - name: Show RDP Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        ANDROID 10 CLOUD RDP READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "RDP Address : $env:TAILSCALE_IP"
          Write-Host "RDP Port    : 3389"
          Write-Host "Username    : AndroidRDP"
          Write-Host ""
          Write-Host "Android     : Android 10"
          Write-Host "API         : 29"
          Write-Host "ABI         : x86_64"
          Write-Host "AVD         : Android29"
          Write-Host ""
          Write-Host "Connect using Microsoft Remote Desktop"
          Write-Host "from your phone."
          Write-Host ""
          Write-Host "=============================================="

      # ============================================================
      # 13. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Android RDP Alive
        shell: pwsh
        run: |
          Write-Host "Android RDP is running."

          while ($true) {

              $state = (& $env:ADB get-state 2>$null).Trim()

              if ($state -ne "device") {
                  Write-Warning "ADB/emulator state: $state"
              }

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Android 10 RDP ACTIVE"

              Start-Sleep -Seconds 300
          }
