name: Ubuntu Waydroid RDP

on:
  workflow_dispatch:

jobs:
  waydroid:
    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # BASIC SYSTEM
      # ------------------------------------------------------------
      - name: Install Ubuntu desktop + RDP
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            xfce4-panel \
            xfce4-session \
            xfwm4 \
            dbus-x11 \
            xrdp \
            xorgxrdp \
            curl \
            wget \
            unzip \
            ca-certificates \
            jq \
            psmisc \
            procps \
            iproute2 \
            net-tools \
            mesa-utils \
            weston \
            wayland-utils \
            xwayland \
            uidmap

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      # ------------------------------------------------------------
      # RDP USER
      # ------------------------------------------------------------
      - name: Create RDP user
        shell: bash
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -eux

          if [ -z "$RDP_PASSWORD" ]; then
            echo "RDP_PASSWORD secret is missing."
            exit 1
          fi

          sudo useradd -m -s /bin/bash android || true

          echo "android:$RDP_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo android

          sudo mkdir -p /home/android

          sudo tee /home/android/.xsession >/dev/null <<'EOF'
          startxfce4
          EOF

          sudo chown android:android /home/android/.xsession
          sudo chmod 700 /home/android/.xsession

      # ------------------------------------------------------------
      # XRDP CONFIG
      # ------------------------------------------------------------
      - name: Configure XRDP
        shell: bash
        run: |
          set -eux

          sudo sed -i \
            's/^test -x \/etc\/X11\/Xsession && exec \/etc\/X11\/Xsession/# disabled/' \
            /etc/xrdp/startwm.sh || true

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/share:/usr/local/share

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo systemctl restart xrdp

      # ------------------------------------------------------------
      # KERNEL CHECK
      # ------------------------------------------------------------
      - name: Check Waydroid kernel support
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " KERNEL"
          echo "=============================================="

          uname -a

          echo
          echo "Binder:"
          find /dev -maxdepth 2 -iname '*binder*' -print 2>/dev/null || true

          echo
          echo "Binder filesystem:"
          mount | grep -i binder || true

          echo
          echo "Ashmem:"
          ls -l /dev/ashmem 2>/dev/null || true

          echo
          echo "Memfd:"
          grep -E 'memfd|binder|ashmem' /proc/filesystems 2>/dev/null || true

          echo
          echo "KVM:"
          ls -l /dev/kvm 2>/dev/null || true

      # ------------------------------------------------------------
      # WAYDROID
      # ------------------------------------------------------------
      - name: Install Waydroid
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates

          curl -s https://repo.waydro.id | sudo bash

          sudo apt-get update

          sudo apt-get install -y waydroid

          waydroid --version

      # ------------------------------------------------------------
      # WAYDROID INITIALIZATION
      # ------------------------------------------------------------
      - name: Initialize Waydroid
        shell: bash
        run: |
          set -eux

          sudo waydroid init

      # ------------------------------------------------------------
      # WAYDROID CONFIG
      # ------------------------------------------------------------
      - name: Configure Waydroid
        shell: bash
        run: |
          set -eux

          sudo waydroid prop set persist.waydroid.multi_windows true || true

          sudo waydroid prop set persist.waydroid.width 1280 || true
          sudo waydroid prop set persist.waydroid.height 720 || true

      # ------------------------------------------------------------
      # START WAYDROID
      # ------------------------------------------------------------
      - name: Start Waydroid container
        shell: bash
        run: |
          set -eux

          sudo waydroid container start

          sleep 10

          sudo waydroid status || true

      # ------------------------------------------------------------
      # START SESSION
      # ------------------------------------------------------------
      - name: Start Waydroid session
        shell: bash
        run: |
          set -eux

          sudo -u android bash -lc '
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"

            waydroid session start > /tmp/waydroid-session.log 2>&1 &
          '

          sleep 15

          cat /tmp/waydroid-session.log || true

          sudo waydroid status || true

      # ------------------------------------------------------------
      # APK
      # ------------------------------------------------------------
      - name: Install APK if present
        shell: bash
        run: |
          set -eux

          APK="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
            \( -iname '*.apk' \) | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "No APK found in repository."
            echo "Put your APK in the repository, for example:"
            echo "app.apk"
            exit 0
          fi

          echo "Installing: $APK"

          sudo -u android bash -lc \
            "waydroid app install '$APK'"

          sudo -u android bash -lc \
            "waydroid app list"

      # ------------------------------------------------------------
      # ADB
      # ------------------------------------------------------------
      - name: Check Android
        shell: bash
        run: |
          set +e

          echo "Waydroid status:"
          sudo waydroid status

          echo
          echo "Android packages:"
          sudo waydroid shell pm list packages | head -100

          echo
          echo "Waydroid logs:"
          sudo waydroid log -n 100

      # ------------------------------------------------------------
      # TAILSCALE
      # ------------------------------------------------------------
      - name: Install Tailscale
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -eux

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-waydroid-${GITHUB_RUN_ID}"

          echo
          echo "=============================================="
          echo " TAILSCALE"
          echo "=============================================="

          tailscale ip -4 || true
          tailscale status || true

      # ------------------------------------------------------------
      # KEEP RUNNER ALIVE
      # ------------------------------------------------------------
      - name: Keep session alive
        shell: bash
        run: |
          set +e

          echo
          echo "=============================================="
          echo " WAYDROID RDP SERVER"
          echo "=============================================="

          echo
          echo "RDP user: android"

          echo
          echo "Tailscale IP:"
          tailscale ip -4 2>/dev/null || echo "Tailscale unavailable"

          echo
          echo "XRDP:"
          sudo systemctl status xrdp --no-pager || true

          echo
          echo "Waydroid:"
          sudo waydroid status || true

          echo
          echo "=============================================="
          echo " RUNNING"
          echo "=============================================="

          while true; do
            sleep 60
          done
