name: Android Waydroid RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waydroid:
    name: Ubuntu + Waydroid + APK + RDP
    runs-on: ubuntu-24.04

    timeout-minutes: 330

    env:
      ANDROID_USER: android
      WAYDROID_WIDTH: "1280"
      WAYDROID_HEIGHT: "720"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SYSTEM DIAGNOSTICS
      # ==========================================================

      - name: System diagnostics
        shell: bash
        run: |
          set +e

          mkdir -p "$RUNNER_TEMP/waydroid-logs"

          {
            echo "================ SYSTEM ================"
            date
            uname -a

            echo
            echo "OS:"
            cat /etc/os-release

            echo
            echo "CPU:"
            lscpu

            echo
            echo "MEMORY:"
            free -h

            echo
            echo "DISK:"
            df -h

            echo
            echo "ARCH:"
            uname -m

            echo
            echo "VIRTUALIZATION:"
            systemd-detect-virt || true

            echo
            echo "KVM:"
            ls -l /dev/kvm 2>/dev/null || true

            echo
            echo "BINDER DEVICES:"
            find /dev -maxdepth 3 \
              \( -iname '*binder*' -o -iname 'binderfs' \) \
              -print 2>/dev/null

            echo
            echo "BINDER MOUNTS:"
            mount | grep -i binder || true

            echo
            echo "ASHMEM:"
            ls -l /dev/ashmem 2>/dev/null || true

            echo
            echo "CGROUP:"
            mount | grep cgroup || true

            echo
            echo "WAYLAND:"
            ls -la /run/user/* 2>/dev/null || true

          } | tee "$RUNNER_TEMP/waydroid-logs/system.txt"

      # ==========================================================
      # 3. INSTALL DESKTOP + XRDP
      # ==========================================================

      - name: Install XFCE and XRDP
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            xfce4-panel \
            xfce4-session \
            xfwm4 \
            dbus-x11 \
            dbus-user-session \
            xrdp \
            xorgxrdp \
            xserver-xorg-core \
            xwayland \
            weston \
            wayland-utils \
            mesa-utils \
            curl \
            wget \
            ca-certificates \
            unzip \
            jq \
            psmisc \
            procps \
            iproute2 \
            net-tools \
            lxc \
            uidmap \
            policykit-1 \
            polkitd \
            iptables \
            bridge-utils

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      # ==========================================================
      # 4. CREATE RDP USER
      # ==========================================================

      - name: Create RDP user
        shell: bash
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          if [ -z "$RDP_PASSWORD" ]; then
            echo "::error::RDP_PASSWORD secret is missing."
            exit 1
          fi

          if ! id "$ANDROID_USER" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$ANDROID_USER"
          fi

          echo "$ANDROID_USER:$RDP_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$ANDROID_USER"

          USER_UID="$(id -u "$ANDROID_USER")"
          USER_HOME="$(getent passwd "$ANDROID_USER" | cut -d: -f6)"

          echo "USER_UID=$USER_UID" >> "$GITHUB_ENV"
          echo "USER_HOME=$USER_HOME" >> "$GITHUB_ENV"

          sudo mkdir -p "/run/user/$USER_UID"
          sudo chown "$ANDROID_USER:$ANDROID_USER" \
            "/run/user/$USER_UID"
          sudo chmod 700 "/run/user/$USER_UID"

      # ==========================================================
      # 5. XRDP CONFIG
      # ==========================================================

      - name: Configure XRDP
        shell: bash
        run: |
          set -euxo pipefail

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/share:/usr/local/share

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo -u "$ANDROID_USER" bash -c \
            'printf "%s\n" "startxfce4" > "$HOME/.xsession"'

          sudo chown "$ANDROID_USER:$ANDROID_USER" \
            "$USER_HOME/.xsession"

          sudo systemctl restart xrdp

          echo "XRDP:"
          sudo systemctl --no-pager status xrdp || true

          echo
          echo "PORT 3389:"
          sudo ss -lntp | grep ':3389' || true

      # ==========================================================
      # 6. WAYDROID KERNEL GATE
      # ==========================================================

      - name: Validate Waydroid kernel
        shell: bash
        run: |
          set +e

          LOG="$RUNNER_TEMP/waydroid-logs/kernel.txt"

          {
            echo "================ WAYDROID KERNEL CHECK ================"

            echo
            echo "Kernel:"
            uname -a

            echo
            echo "Architecture:"
            uname -m

            echo
            echo "Binder:"
            find /dev -maxdepth 3 \
              \( -iname '*binder*' -o -iname 'binderfs' \) \
              -print 2>/dev/null

            echo
            echo "Binder mount:"
            mount | grep -i binder || true

            echo
            echo "Ashmem:"
            ls -l /dev/ashmem 2>/dev/null || true

            echo
            echo "KVM:"
            ls -l /dev/kvm 2>/dev/null || true

            echo
            echo "Kernel modules:"
            lsmod | grep -Ei 'binder|ashmem|vhost' || true

          } | tee "$LOG"

          BINDER=0

          if [ -e /dev/binder ]; then
            BINDER=1
          fi

          if [ -e /dev/binderfs ]; then
            BINDER=1
          fi

          if mount | grep -qi binder; then
            BINDER=1
          fi

          if [ "$BINDER" -eq 0 ]; then
            echo
            echo "::warning::Binder support was not detected."

            echo
            echo "This GitHub-hosted runner may not be suitable"
            echo "for Waydroid."

            echo
            echo "The complete diagnostic is in:"
            echo "$LOG"

            # Do NOT continue pretending Android is available.
            exit 1
          fi

          echo
          echo "Binder support detected."

      # ==========================================================
      # 7. INSTALL WAYDROID
      # ==========================================================

      - name: Install Waydroid
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL https://repo.waydro.id | sudo bash

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y waydroid

          echo
          waydroid --version

      # ==========================================================
      # 8. INITIALIZE WAYDROID
      # ==========================================================

      - name: Initialize Waydroid
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d /var/lib/waydroid/images ]; then
            sudo waydroid init
          else
            echo "Waydroid images already exist."
          fi

          echo
          echo "Waydroid directory:"
          sudo du -sh /var/lib/waydroid 2>/dev/null || true

      # ==========================================================
      # 9. WAYDROID PROPERTIES
      # ==========================================================

      - name: Configure Waydroid
        shell: bash
        run: |
          set +e

          sudo waydroid prop set \
            persist.waydroid.multi_windows true

          sudo waydroid prop set \
            persist.waydroid.width "$WAYDROID_WIDTH"

          sudo waydroid prop set \
            persist.waydroid.height "$WAYDROID_HEIGHT"

          sudo waydroid prop set \
            persist.waydroid.suspend false

          sudo waydroid prop set \
            persist.waydroid.udev false

          echo "Properties configured."

      # ==========================================================
      # 10. START CONTAINER
      # ==========================================================

      - name: Start Waydroid container
        shell: bash
        run: |
          set -euo pipefail

          sudo waydroid container start

          sleep 10

          echo
          sudo waydroid status

      # ==========================================================
      # 11. PREPARE USER SESSION
      # ==========================================================

      - name: Prepare Wayland user session
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p "/run/user/$USER_UID"

          sudo chown \
            "$ANDROID_USER:$ANDROID_USER" \
            "/run/user/$USER_UID"

          sudo chmod 700 \
            "/run/user/$USER_UID"

          sudo -u "$ANDROID_USER" \
            dbus-run-session \
            -- bash -c '
              echo "D-Bus user session test OK"
            '

      # ==========================================================
      # 12. START WESTON
      # ==========================================================

      - name: Start headless Wayland compositor
        shell: bash
        run: |
          set +e

          LOG="$RUNNER_TEMP/waydroid-logs/weston.txt"

          sudo -u "$ANDROID_USER" \
            env \
            HOME="$USER_HOME" \
            USER="$ANDROID_USER" \
            LOGNAME="$ANDROID_USER" \
            XDG_RUNTIME_DIR="/run/user/$USER_UID" \
            WAYLAND_DISPLAY=wayland-0 \
            weston \
              --backend=headless-backend.so \
              --socket=wayland-0 \
              --width="$WAYDROID_WIDTH" \
              --height="$WAYDROID_HEIGHT" \
              > "$LOG" 2>&1 &

          WESTON_PID=$!

          echo "WESTON_PID=$WESTON_PID" >> "$GITHUB_ENV"

          echo "Weston PID: $WESTON_PID"

          for i in $(seq 1 30); do
            sleep 1

            if [ -S "/run/user/$USER_UID/wayland-0" ]; then
              echo "Wayland socket is ready."
              break
            fi

            if ! kill -0 "$WESTON_PID" 2>/dev/null; then
              echo "::error::Weston exited unexpectedly."
              cat "$LOG"
              exit 1
            fi
          done

          if [ ! -S "/run/user/$USER_UID/wayland-0" ]; then
            echo "::error::Wayland socket was not created."
            cat "$LOG"
            exit 1
          fi

          echo
          echo "Wayland socket:"
          ls -la "/run/user/$USER_UID/"

      # ==========================================================
      # 13. START WAYDROID SESSION
      # ==========================================================

      - name: Start Waydroid session
        shell: bash
        run: |
          set +e

          LOG="$RUNNER_TEMP/waydroid-logs/session.txt"

          sudo -u "$ANDROID_USER" \
            env \
            HOME="$USER_HOME" \
            USER="$ANDROID_USER" \
            LOGNAME="$ANDROID_USER" \
            XDG_RUNTIME_DIR="/run/user/$USER_UID" \
            XDG_SESSION_TYPE=wayland \
            XDG_CURRENT_DESKTOP=Wayland \
            WAYLAND_DISPLAY=wayland-0 \
            dbus-run-session \
            waydroid session start \
            > "$LOG" 2>&1 &

          SESSION_PID=$!

          echo "WAYDROID_SESSION_PID=$SESSION_PID" \
            >> "$GITHUB_ENV"

          echo "Session PID: $SESSION_PID"

          READY=0

          for i in $(seq 1 90); do

            sleep 2

            STATUS="$(sudo waydroid status 2>&1)"

            echo "[$i/90]"
            echo "$STATUS"

            if echo "$STATUS" | grep -qi \
              "Session.*RUNNING"; then

              READY=1
              break

            fi

            if ! kill -0 "$SESSION_PID" 2>/dev/null; then
              echo "::error::Waydroid session process exited."
              break
            fi

          done

          echo
          echo "================ SESSION LOG ================"
          cat "$LOG" || true

          echo
          echo "================ WAYDROID STATUS ================"
          sudo waydroid status || true

          if [ "$READY" -ne 1 ]; then

            echo
            echo "::error::Waydroid Android session did not become RUNNING."

            echo
            echo "Waydroid log:"
            sudo waydroid log -n 250 || true

            exit 1
          fi

      # ==========================================================
      # 14. FIND APK
      # ==========================================================

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname '*.apk' \
            -not -path '*/.git/*' \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::No APK found in repository."
            echo
            echo "Put an APK in the repository, for example:"
            echo "app.apk"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo
          echo "APK:"
          echo "$APK"

          echo
          file "$APK" || true

          echo
          ls -lh "$APK"

      # ==========================================================
      # 15. INSTALL APK
      # ==========================================================

      - name: Install APK
        shell: bash
        run: |
          set +e

          LOG="$RUNNER_TEMP/waydroid-logs/apk-install.txt"

          sudo chown \
            "$ANDROID_USER:$ANDROID_USER" \
            "$APK_PATH"

          sudo -u "$ANDROID_USER" \
            env \
            HOME="$USER_HOME" \
            USER="$ANDROID_USER" \
            XDG_RUNTIME_DIR="/run/user/$USER_UID" \
            WAYLAND_DISPLAY=wayland-0 \
            waydroid app install "$APK_PATH" \
            > "$LOG" 2>&1

          RESULT=$?

          cat "$LOG"

          if [ "$RESULT" -ne 0 ]; then
            echo
            echo "::error::APK installation failed."
            echo
            echo "Possible causes:"
            echo "- APK architecture incompatible"
            echo "- APK requires unsupported Android features"
            echo "- Android session is not ready"
            echo "- APK is split/APKS/XAPK rather than a normal APK"

            sudo waydroid log -n 200 || true

            exit "$RESULT"
          fi

          echo
          echo "APK installed successfully."

      # ==========================================================
      # 16. ANDROID PACKAGE CHECK
      # ==========================================================

      - name: Verify Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Waydroid status:"
          sudo waydroid status

          echo
          echo "Android packages:"
          sudo waydroid shell \
            pm list packages \
            | head -200

      # ==========================================================
      # 17. TAILSCALE
      # ==========================================================

      - name: Install Tailscale
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            https://tailscale.com/install.sh \
            | sudo bash

      - name: Connect Tailscale
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: bash
        run: |
          set -euxo pipefail

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="waydroid-${GITHUB_RUN_ID}"

          echo
          echo "================ TAILSCALE ================"

          tailscale ip -4
          tailscale status

      # ==========================================================
      # 18. FINAL DIAGNOSTICS
      # ==========================================================

      - name: Final status
        shell: bash
        run: |
          set +e

          {
            echo "================ FINAL STATUS ================"

            echo
            echo "XRDP:"
            sudo systemctl status xrdp --no-pager

            echo
            echo "RDP PORT:"
            sudo ss -lntp | grep ':3389' || true

            echo
            echo "WAYDROID:"
            sudo waydroid status

            echo
            echo "TAILSCALE:"
            tailscale ip -4 2>/dev/null || true

            echo
            echo "ANDROID PACKAGES:"
            sudo waydroid shell pm list packages | head -100

          } | tee "$RUNNER_TEMP/waydroid-logs/final.txt"

      # ==========================================================
      # 19. UPLOAD ALL LOGS
      # ==========================================================

      - name: Upload Waydroid logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waydroid-debug-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/waydroid-logs/
          if-no-files-found: warn
          retention-days: 7

      # ==========================================================
      # 20. KEEP RUNNER ALIVE
      # ==========================================================

      - name: Keep RDP alive
        if: success()
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "              WAYDROID RDP IS RUNNING"
          echo "============================================================"

          echo
          echo "Username:"
          echo "android"

          echo
          echo "Port:"
          echo "3389"

          echo
          echo "Tailscale IP:"
          tailscale ip -4 2>/dev/null || \
            echo "Tailscale not configured."

          echo
          echo "Connect from your phone using an RDP client."
          echo
          echo "The runner will stay alive until the workflow timeout."

          while true; do
            sleep 60

            echo
            echo "===== HEARTBEAT $(date) ====="

            sudo waydroid status || true

          done
